apiVersion: v1
kind: ConfigMap
metadata:
  name: game-demo
data:
  # property-like keys; each key maps to a simple value
  player_initial_lives: "3"
  score: "1000"
  name: "John"

---

apiVersion: v1
kind: Pod
metadata:
  name: configmap-demo-pod
  labels:
    purpose: demonstrate-configmaps
spec:
  containers:
  - name: configmap-demo-container
    image: nginx:latest
    env:
    - name: PLAYER_INITIAL_LIVES
      valueFrom:
        configMapKeyRef:
          name: game-demo
          key: player_initial_lives
    - name: SCORE
      valueFrom:
        configMapKeyRef:
          name: game-demo
          key: score
    - name: NAME
      valueFrom:
        configMapKeyRef:
          name: game-demo
          key: name