apiVersion: v1
kind: ConfigMap
metadata:
  name: game-demo
data:
  # property-like keys; each key maps to a simple value
  player_initial_lives: "3"
  score: "1000"
  name: "John"

---

apiVersion: v1
kind: Pod
metadata:
  name: configmap-demo-pod
  labels:
    purpose: demonstrate-configmaps
spec:
  containers:
  - name: configmap-demo-container
    image: nginx:latest
    env:
    - name: PLAYER_INITIAL_LIVES
      valueFrom:
        configMapKeyRef:
          name: game-demo
          key: player_initial_lives
    - name: SCORE
      valueFrom:
        configMapKeyRef:
          name: game-demo
          key: score
    - name: NAME
      valueFrom:
        configMapKeyRef:
          name: game-demo
          key: name

--- 

apiVersion: v1
kind: Pod
metadata:
  name: configmap-demo-pod-2
spec:
  containers:
  - name: demo 
    image: nginx:latest
    envFrom:
    - configMapRef:
        name: game-demo

--- 




apiVersion: v1
kind: Pod
metadata:
  name: configmap-demo-pod-3
spec:
  containers:
  - name: demo 
    image: nginx:latest
      volumeMounts:
      - name: config
        mountPath: "/config"
        readOnly: true
  volumes:
  # You set volumes at the Pod level, then mount them into containers inside that Pod
  - name: config
    configMap:
      # Provide the name of the ConfigMap you want to mount.
      name: game-demo
      # An array of keys from the ConfigMap to create as files