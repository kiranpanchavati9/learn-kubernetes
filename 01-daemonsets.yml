apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: daemon01
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: daemon01
  template:
    metadata:
      labels:
        app: daemon01
    spec:
      containers:
        - name: nginx
          image: nginx:1.27.0
          ports:
            - containerPort: 80

