apiVersion: v1
kind: Pod 
metadata:
  name: multi-container-shared-storage

spec:
  volumes:
  - name: sharedstorage
    emptyDir: {}

  containers:
    - name: nginx-container-1
      image: nginx:latest
      volumeMounts:
        - mountPath: /opt
          name: sharedstorage

    - name: busybox-container-1
      image: busybox:latest
      volumeMounts:
        - mountPath: /opt
          name: sharedstorage

  